<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RF Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L9 26 L12 10 L16 22 L20 6 L24 26 L30 26' fill='none' stroke='%2300a0ff' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <button id="menuBtn" class="icon-btn" title="Show or hide the menu"><img src="res/icons/menu.png" alt="Menu" /></button>
        <button id="playBtn" class="icon-btn" title="Start or stop the radios"><img id="playIcon" src="res/icons/play.png" alt="Start" /></button>
        <div id="freqSelect"></div>
        <div id="bandLabel"></div>
        <div id="topSpacer"></div>
        <div id="alerts" hidden title="Active interference. Click to show the first one."></div>
        <div id="snr" title="Signal to noise ratio of the selected band"><canvas id="snrCanvas"></canvas></div>
      </div>
      <div id="error" hidden></div>
      <div id="main">
        <div id="menu"></div>
        <div id="menuResize"></div>
        <div id="panes"></div>
        <div id="controls">
          <div class="vctl"><div class="vlabel">Zoom</div><div id="zoomSlider" class="vslider"></div></div>
          <div class="vctl"><div class="vlabel">Max</div><div id="maxSlider" class="vslider"></div></div>
          <div class="vctl"><div class="vlabel">Min</div><div id="minSlider" class="vslider"></div></div>
        </div>
      </div>
      <div id="notices"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
